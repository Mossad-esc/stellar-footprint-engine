openapi: 3.0.3
info:
  title: Stellar Footprint Service API
  description: |
    Pre-flight simulation and footprint extraction for Soroban smart contract transactions.

    This service automates the complex footprint extraction process — a required step before
    submitting any Soroban transaction to the Stellar network.
  version: 1.0.0
  license:
    name: MIT

servers:
  - url: /api/v1
    description: Current API version

tags:
  - name: simulation
    description: Transaction simulation and footprint extraction
  - name: utilities
    description: XDR decoding, health checks, and cache management
  - name: network
    description: Network status and information

paths:
  /health:
    get:
      tags: [utilities]
      summary: Liveness check (deprecated alias)
      description: |
        Returns service liveness status. Deprecated — use `/health/live` instead.
        Kept for backwards compatibility with load balancers and uptime monitors.
      operationId: getHealth
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                uptime: 123.45
                version: 1.0.0
                timestamp: "2024-01-01T00:00:00.000Z"

  /health/live:
    get:
      tags: [utilities]
      summary: Liveness check
      description: |
        Returns service liveness status. Use this endpoint with Kubernetes `livenessProbe`
        and load-balancer health checks.
      operationId: getLiveness
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                uptime: 123.45
                version: 1.0.0
                timestamp: "2024-01-01T00:00:00.000Z"

  /health/ready:
    get:
      tags: [utilities]
      summary: Readiness check
      description: |
        Returns readiness status. Checks whether the cache backend and RPC circuit breaker
        are healthy. Use with Kubernetes `readinessProbe` — traffic is only sent to pods
        that return `200` here.
      operationId: getReadiness
      responses:
        "200":
          description: Service is ready to accept traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                status: ready
                checks:
                  cache:
                    status: healthy
                    details:
                      backend: redis
                  rpcCircuitBreaker:
                    status: healthy
                    details:
                      state: closed
                      failureCount: 0
                timestamp: "2024-01-01T00:00:00.000Z"
        "503":
          description: Service is not ready (cache or RPC unhealthy)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                status: not ready
                checks:
                  cache:
                    status: unhealthy
                    details:
                      error: "Connection refused"
                  rpcCircuitBreaker:
                    status: healthy
                    details:
                      state: closed
                      failureCount: 0
                timestamp: "2024-01-01T00:00:00.000Z"

  /simulate/supported-networks:
    get:
      tags: [network]
      summary: List configured RPC networks
      description: |
        Returns the list of Stellar networks (`testnet`, `mainnet`, `futurenet`)
        that currently have RPC URLs configured on the server.
      operationId: getSupportedNetworks
      responses:
        "200":
          description: Configured networks retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportedNetworksResponse"
              example:
                networks: [testnet, mainnet]

  /simulate:
    post:
      tags: [simulation]
      summary: Simulate a Soroban transaction
      description: |
        Submits a transaction XDR to the Stellar RPC `simulateTransaction` endpoint,
        extracts the footprint (read-only and read-write ledger keys), and returns
        resource cost estimates.

        When `webhookUrl` (HTTPS) is supplied, returns `202 Accepted` with a `jobId`
        immediately and delivers the simulation payload asynchronously signed with
        `X-Webhook-Signature` (`sha256=<hmac>`).

        Results are cached by a hash of the request body. The `X-Cache` response header
        indicates whether the result was served from cache (`HIT`) or freshly simulated (`MISS`).
      operationId: simulate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateRequest"
            example:
              xdr: "AAAAAgAAAAC..."
              network: testnet
      responses:
        "200":
          description: Simulation succeeded
          headers:
            X-Cache:
              description: Whether the result was served from cache
              schema:
                type: string
                enum: [HIT, MISS]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulateSuccessResponse"
              example:
                success: true
                footprint:
                  readOnly: ["AAAABgAAAAHZ...", "AAAABgAAAAHa..."]
                  readWrite: ["AAAABgAAAAHb..."]
                cost:
                  cpuInsns: "1234567"
                  memBytes: "8192"
        "202":
          description: Asynchronous simulation queued for webhook delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAcceptedResponse"
              example:
                accepted: true
                jobId: "6fa459ea-ee8a-3ca4-894e-db77e160355e"
                status: pending
        "400":
          description: Missing or invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: "Missing required field: xdr"
                code: "MISSING_XDR"
        "422":
          description: Simulation failed (contract error or restoration required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulateFailureResponse"
              examples:
                contractError:
                  summary: Contract execution error
                  value:
                    success: false
                    error: "contract panic: assertion failed"
                    code: "RPC_SIMULATION_ERROR"
                restoreRequired:
                  summary: Ledger entry restoration required
                  value:
                    success: false
                    error: "Transaction requires ledger entry restoration before simulation."
                    code: "SIMULATION_RESTORE_REQUIRED"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /simulate/dry-run:
    post:
      tags: [simulation]
      summary: Parse transaction XDR locally without calling RPC
      description: |
        Decodes the transaction envelope locally and returns source account, sequence
        number, and operation metadata without making any Stellar RPC network request.
      operationId: simulateDryRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequest"
            example:
              xdr: "AAAAAgAAAAC..."
              network: testnet
      responses:
        "200":
          description: Transaction XDR parsed locally
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DryRunResponse"
              example:
                dryRun: true
                network: testnet
                sourceAccount: "GABC..."
                sequence: "101"
                operationCount: 1
                operations:
                  - type: invokeHostFunction
                    source: null
        "400":
          $ref: "#/components/responses/BadRequest"

  /simulate/history:
    get:
      tags: [simulation]
      summary: Recent simulation history for caller IP
      description: |
        Returns up to the last 100 simulation summaries recorded for the caller's IP
        address within a rolling 24-hour TTL window.
      operationId: getSimulateHistory
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of history entries to return (1–100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Simulation history retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulateHistoryResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /simulate/jobs/{jobId}:
    get:
      tags: [simulation]
      summary: Inspect async webhook simulation job status
      description: |
        Returns delivery status (`pending`, `delivered`, or `failed`), attempt count,
        and timestamps for an asynchronous webhook simulation job queued via `/simulate`.
      operationId: getSimulationJob
      parameters:
        - name: jobId
          in: path
          required: true
          description: Job identifier returned in the `202 Accepted` `/simulate` response
          schema:
            type: string
      responses:
        "200":
          description: Webhook simulation job status retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookJobResponse"
        "404":
          description: Webhook job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: "Webhook job not found"
                code: "JOB_NOT_FOUND"

  /simulate/batch:
    post:
      tags: [simulation]
      summary: Simulate multiple Soroban transactions
      description: |
        Simulates up to 10 transactions concurrently. Each transaction is processed
        independently; failures in one entry do not affect others.

        The `X-Cache` header reflects aggregate cache status: `HIT` (all cached),
        `PARTIAL` (some cached), or `MISS` (none cached).
      operationId: simulateBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateBatchRequest"
            example:
              transactions:
                - xdr: "AAAAAgAAAAC..."
                - xdr: "AAAAAgAAAAD..."
              network: testnet
      responses:
        "200":
          description: Batch processed (individual results may contain errors)
          headers:
            X-Cache:
              description: Aggregate cache status across all results
              schema:
                type: string
                enum: [HIT, PARTIAL, MISS]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulateBatchResponse"
              example:
                results:
                  - index: 0
                    success: true
                    footprint:
                      readOnly: ["AAAABgAAAAHZ..."]
                      readWrite: ["AAAABgAAAAHb..."]
                    cost:
                      cpuInsns: "1234567"
                      memBytes: "8192"
                  - index: 1
                    success: false
                    error: "contract panic: assertion failed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /simulate/cost-breakdown:
    get:
      tags: [simulation]
      summary: Detailed cost breakdown
      description: |
        Returns a detailed breakdown of Soroban resource fees given raw CPU instruction
        and memory byte counts. Useful for building fee estimation UIs without running
        a full simulation.
      operationId: getCostBreakdown
      parameters:
        - name: cpuInsns
          in: query
          required: true
          description: CPU instructions count (non-negative integer string)
          schema:
            type: string
            example: "1234567"
        - name: memBytes
          in: query
          required: true
          description: Memory bytes count (non-negative integer string)
          schema:
            type: string
            example: "8192"
        - name: network
          in: query
          required: false
          description: Stellar network to use for fee parameters
          schema:
            type: string
            enum: [testnet, mainnet, futurenet]
            default: testnet
      responses:
        "200":
          description: Cost breakdown calculated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostBreakdownResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /network/status:
    get:
      tags: [network]
      summary: Network status
      description: |
        Returns current Stellar network information including the latest ledger sequence
        and network passphrase. When `network` is omitted, queries all configured networks.
        Response is cached for 10 seconds.
      operationId: getNetworkStatus
      parameters:
        - name: network
          in: query
          required: false
          description: Network to query (omit to query all configured networks)
          schema:
            type: string
            enum: [testnet, mainnet, futurenet]
      responses:
        "200":
          description: Network status retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkStatusResponse"
              example:
                success: true
                data:
                  latestLedger: 12345678
                  passphrase: "Test SDF Network ; September 2015"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /footprint/diff:
    post:
      tags: [simulation]
      summary: Compare two Soroban transaction footprints
      description: |
        Computes added and removed read-only and read-write ledger keys between two
        transaction footprints (`before` and `after`).
      operationId: diffFootprint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FootprintDiffRequest"
      responses:
        "200":
          description: Footprint diff computed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootprintDiffResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /validate:
    post:
      tags: [utilities]
      summary: Validate transaction XDR
      description: |
        Validates a transaction XDR locally without simulating it against the network.
        Detects malformed XDR, passphrase mismatches, zero/empty operation lists, and
        emits warnings for non-Soroban operations or `0` sequence numbers.
      operationId: validateXdr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequest"
            example:
              xdr: "AAAAAgAAAAC..."
              network: testnet
      responses:
        "200":
          description: XDR validation completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
              example:
                success: true
                data:
                  valid: true
                  errors: []
                  warnings: []
                  network: testnet
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /decode:
    get:
      tags: [utilities]
      summary: Decode XDR to human-readable JSON
      description: |
        Decodes a base64-encoded XDR string into a human-readable JSON representation.
        Useful for debugging transaction structures and ledger entries.

        Supported `type` values: `transaction`, `operation`, `ledger_key`, `auth_entry`.
      operationId: decodeXdr
      parameters:
        - name: xdr
          in: query
          required: true
          description: Base64-encoded XDR string to decode
          schema:
            type: string
            example: "AAAAAgAAAAC..."
        - name: type
          in: query
          required: false
          description: |
            XDR type for decoding. Defaults to `transaction`.
            Supported values: `transaction`, `operation`, `ledger_key`, `auth_entry`.
          schema:
            type: string
            enum: [transaction, operation, ledger_key, auth_entry]
            default: transaction
      responses:
        "200":
          description: XDR decoded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecodeResponse"
              example:
                success: true
                type: transaction
                decoded:
                  fee: 100
                  operations: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /restore:
    post:
      tags: [simulation]
      summary: Build a ledger entry restoration transaction
      description: |
        Builds a restoration transaction for expired ledger entries referenced by the
        provided XDR. Submit this transaction to the network before retrying `/simulate`
        when you receive a `422` with `"restoration required"`.
      operationId: restore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRequest"
            example:
              xdr: "AAAAAgAAAAC..."
              network: testnet
      responses:
        "200":
          description: Restoration check completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResponse"
              example:
                success: true
                data:
                  needsRestore: true
                  restoreXdr: "AAAAAgAAAAD..."
                  fee: "100"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /estimate-fee:
    post:
      tags: [simulation]
      summary: Estimate transaction fee
      description: |
        Returns a fee estimate given raw resource usage values (`cpuInsns`, `memBytes`).
        Use the values from a `/simulate` response to compute the fee before building
        and signing the final transaction.
      operationId: estimateFee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateFeeRequest"
            example:
              cpuInsns: "1234567"
              memBytes: "8192"
              network: testnet
      responses:
        "200":
          description: Fee estimate calculated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateFeeResponse"
              example:
                inclusionFee: "100"
                resourceFee: "2450"
                totalFee: "2550"
                network: testnet
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /cache:
    delete:
      tags: [utilities]
      summary: Flush simulation cache
      description: |
        Flushes all cached simulation entries from the active cache backend
        (`redis` or `memory`).
      operationId: invalidateCache
      responses:
        "200":
          description: Cache invalidated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheInvalidateResponse"
              example:
                message: "Cache invalidated"
                backend: memory
        "500":
          $ref: "#/components/responses/InternalServerError"

  /openapi.json:
    get:
      tags: [utilities]
      summary: OpenAPI specification (JSON)
      description: Serves the raw OpenAPI specification as JSON.
      operationId: getOpenApiSpec
      responses:
        "200":
          description: OpenAPI specification
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Optional API key authentication when `API_KEYS` is configured
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: Optional `X-API-Key` header alternative when `API_KEYS` is configured

  responses:
    BadRequest:
      description: Missing or invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeErrorResponse"
          example:
            success: false
            error: "Missing required field: xdr"

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        RateLimit-Limit:
          description: Maximum requests allowed in the window
          schema:
            type: integer
          example: 60
        RateLimit-Remaining:
          description: Requests remaining in the current window
          schema:
            type: integer
          example: 0
        RateLimit-Reset:
          description: Unix timestamp (seconds) when the window resets
          schema:
            type: integer
          example: 1700000060
        X-RateLimit-Limit:
          description: Legacy alias for RateLimit-Limit
          schema:
            type: integer
        X-RateLimit-Remaining:
          description: Legacy alias for RateLimit-Remaining
          schema:
            type: integer
        X-RateLimit-Reset:
          description: Legacy alias for RateLimit-Reset
          schema:
            type: integer
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
          example: 60
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitErrorResponse"
          example:
            error: "Too Many Requests"
            message: "Rate limit exceeded. Try again in 60 seconds."
            retryAfter: 60

    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeErrorResponse"
          example:
            success: false
            error: "Unexpected error"

    ServiceUnavailable:
      description: RPC circuit breaker is open; service temporarily unavailable
      headers:
        Retry-After:
          description: Seconds until the circuit breaker attempts recovery
          schema:
            type: integer
          example: 28
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeErrorResponse"
          example:
            success: false
            error: "RPC circuit breaker is open. Try again later."

  schemas:
    # ── Shared envelope ──────────────────────────────────────────────────────
    EnvelopeResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        data:
          description: Response payload (shape varies by endpoint)
          additionalProperties: true

    EnvelopeErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string
          description: Human-readable error message

    RateLimitErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "Too Many Requests"
        message:
          type: string
          description: Extended message with retry guidance
          example: "Rate limit exceeded. Try again in 60 seconds."
        retryAfter:
          type: integer
          description: Seconds to wait before retrying
          example: 60

    # ── Health ───────────────────────────────────────────────────────────────
    HealthResponse:
      type: object
      required: [status, uptime, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        uptime:
          type: number
          description: Process uptime in seconds
        version:
          type: string
          description: Service version from package.json
        timestamp:
          type: string
          format: date-time

    ReadinessResponse:
      type: object
      required: [status, checks, timestamp]
      properties:
        status:
          type: string
          enum: [ready, "not ready"]
        checks:
          type: object
          properties:
            cache:
              type: object
              properties:
                status:
                  type: string
                  enum: [healthy, unhealthy]
                details:
                  type: object
                  additionalProperties: true
            rpcCircuitBreaker:
              type: object
              properties:
                status:
                  type: string
                  enum: [healthy, unhealthy]
                details:
                  type: object
                  additionalProperties: true
        timestamp:
          type: string
          format: date-time

    # ── Simulation ───────────────────────────────────────────────────────────
    Network:
      type: string
      enum: [testnet, mainnet, futurenet]
      default: testnet
      description: Stellar network to use

    SupportedNetworksResponse:
      type: object
      required: [networks]
      properties:
        networks:
          type: array
          items:
            $ref: "#/components/schemas/Network"

    SimulateRequest:
      type: object
      required: [xdr]
      properties:
        xdr:
          type: string
          description: Base64-encoded Soroban transaction XDR
          example: "AAAAAgAAAAC..."
        network:
          $ref: "#/components/schemas/Network"
        ledgerSequence:
          type: integer
          minimum: 1
          description: Optional ledger sequence to simulate against (for reproducibility)
          example: 12345678
        webhookUrl:
          type: string
          format: uri
          description: Optional HTTPS callback URL for asynchronous simulation delivery
          example: "https://hooks.example.com/stellar/simulate"

    ValidateRequest:
      type: object
      required: [xdr]
      properties:
        xdr:
          type: string
          description: Base64-encoded Stellar/Soroban transaction XDR
          example: "AAAAAgAAAAC..."
        network:
          $ref: "#/components/schemas/Network"

    ValidateResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [valid, errors, warnings, network]
          properties:
            valid:
              type: boolean
            errors:
              type: array
              items:
                type: string
            warnings:
              type: array
              items:
                type: string
            network:
              $ref: "#/components/schemas/Network"

    DryRunResponse:
      type: object
      required:
        [dryRun, network, sourceAccount, sequence, operationCount, operations]
      properties:
        dryRun:
          type: boolean
          enum: [true]
        network:
          $ref: "#/components/schemas/Network"
        sourceAccount:
          type: string
        sequence:
          type: string
        operationCount:
          type: integer
        operations:
          type: array
          items:
            type: object
            required: [type, source]
            properties:
              type:
                type: string
              source:
                type: string
                nullable: true

    SimulateHistoryResponse:
      type: object
      required: [ip, total, limit, results]
      properties:
        ip:
          type: string
        total:
          type: integer
        limit:
          type: integer
        results:
          type: array
          items:
            type: object
            required:
              [timestamp, network, success, readOnlyCount, readWriteCount]
            properties:
              timestamp:
                type: string
                format: date-time
              network:
                type: string
              success:
                type: boolean
              readOnlyCount:
                type: integer
              readWriteCount:
                type: integer

    WebhookAcceptedResponse:
      type: object
      required: [accepted, jobId, status]
      properties:
        accepted:
          type: boolean
          enum: [true]
        jobId:
          type: string
        status:
          type: string
          enum: [pending]

    WebhookJobResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [jobId, webhookUrl, status, createdAt, attempts]
          properties:
            jobId:
              type: string
            webhookUrl:
              type: string
              format: uri
            status:
              type: string
              enum: [pending, delivered, failed]
            createdAt:
              type: string
              format: date-time
            completedAt:
              type: string
              format: date-time
            attempts:
              type: integer

    SimulateBatchRequest:
      type: object
      required: [transactions]
      properties:
        transactions:
          type: array
          items:
            type: object
            required: [xdr]
            properties:
              xdr:
                type: string
                description: Base64-encoded Soroban transaction XDR
          minItems: 1
          maxItems: 10
          description: Array of transactions to simulate (maximum 10)
        network:
          $ref: "#/components/schemas/Network"

    Footprint:
      type: object
      required: [readOnly, readWrite]
      properties:
        readOnly:
          type: array
          items:
            type: string
          description: Base64-encoded read-only ledger keys
        readWrite:
          type: array
          items:
            type: string
          description: Base64-encoded read-write ledger keys

    ResourceCost:
      type: object
      required: [cpuInsns, memBytes]
      properties:
        cpuInsns:
          type: string
          description: CPU instructions consumed (string to avoid precision loss)
          example: "1234567"
        memBytes:
          type: string
          description: Memory bytes consumed (string to avoid precision loss)
          example: "8192"

    SimulateSuccessResponse:
      type: object
      required: [success, footprint, cost]
      properties:
        success:
          type: boolean
          enum: [true]
        footprint:
          $ref: "#/components/schemas/Footprint"
        cost:
          $ref: "#/components/schemas/ResourceCost"
        cacheHit:
          type: boolean
          description: Whether the result was served from cache

    SimulateFailureResponse:
      type: object
      required: [success, error, code]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string
          description: Human-readable error message from the simulation
        code:
          type: string
          description: Machine-readable error code

    SimulateBatchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            oneOf:
              - allOf:
                  - $ref: "#/components/schemas/SimulateSuccessResponse"
                  - type: object
                    required: [index]
                    properties:
                      index:
                        type: integer
              - allOf:
                  - $ref: "#/components/schemas/SimulateFailureResponse"
                  - type: object
                    required: [index]
                    properties:
                      index:
                        type: integer

    # ── Cost breakdown ───────────────────────────────────────────────────────
    CostBreakdownResponse:
      type: object
      description: Detailed breakdown of Soroban resource fees

    # ── Network status ───────────────────────────────────────────────────────
    NetworkStatusResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            latestLedger:
              type: integer
              description: Latest closed ledger sequence
            passphrase:
              type: string
              description: Network passphrase

    # ── Footprint diff ───────────────────────────────────────────────────────
    FootprintDiffRequest:
      type: object
      required: [before, after]
      properties:
        before:
          $ref: "#/components/schemas/Footprint"
        after:
          $ref: "#/components/schemas/Footprint"

    FootprintDiffResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [readOnly, readWrite]
          properties:
            readOnly:
              type: object
              required: [added, removed]
              properties:
                added:
                  type: array
                  items:
                    type: string
                removed:
                  type: array
                  items:
                    type: string
            readWrite:
              type: object
              required: [added, removed]
              properties:
                added:
                  type: array
                  items:
                    type: string
                removed:
                  type: array
                  items:
                    type: string

    # ── Decode ───────────────────────────────────────────────────────────────
    DecodeResponse:
      type: object
      required: [success, type, decoded]
      properties:
        success:
          type: boolean
        type:
          type: string
          description: XDR type used for decoding
          enum: [transaction, operation, ledger_key, auth_entry]
        decoded:
          type: object
          description: Human-readable JSON representation of the XDR
          additionalProperties: true

    # ── Restore ──────────────────────────────────────────────────────────────
    RestoreRequest:
      type: object
      required: [xdr]
      properties:
        xdr:
          type: string
          description: Base64-encoded Soroban transaction XDR that requires restoration
          example: "AAAAAgAAAAC..."
        network:
          $ref: "#/components/schemas/Network"

    # ── Fee estimation ───────────────────────────────────────────────────────
    EstimateFeeRequest:
      type: object
      required: [cpuInsns, memBytes]
      properties:
        cpuInsns:
          type: string
          description: CPU instructions (non-negative integer string)
          example: "1234567"
        memBytes:
          type: string
          description: Memory bytes (non-negative integer string)
          example: "8192"
        network:
          $ref: "#/components/schemas/Network"

    EstimateFeeResponse:
      type: object
      properties:
        inclusionFee:
          type: string
          description: Base inclusion fee in stroops
        resourceFee:
          type: string
          description: Soroban resource fee in stroops
        totalFee:
          type: string
          description: Total recommended fee in stroops
        network:
          type: string

    # ── Cache ─────────────────────────────────────────────────────────────────
    CacheInvalidateResponse:
      type: object
      required: [message, backend]
      properties:
        message:
          type: string
          example: "Cache invalidated"
        backend:
          type: string
          description: Cache backend that was flushed
          enum: [redis, memory]

    # ── Legacy (kept for backwards compatibility) ─────────────────────────────
    ErrorResponse:
      type: object
      required: [success, error, code]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Machine-readable error code (optional)
        requestId:
          type: string
          description: Request correlation ID from X-Request-ID header
