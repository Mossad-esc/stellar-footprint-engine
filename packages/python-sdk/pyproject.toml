[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stellar-footprint"
version = "1.0.0"
description = "Python SDK for the Stellar Footprint Engine — simulate, diff, decode, and cost Soroban transactions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Mossad-esc", email = "noreply@example.com" }]
keywords = ["stellar", "soroban", "blockchain", "sdk", "footprint"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "respx>=0.21.0",
  "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/Mossad-esc/stellar-footprint-engine"
Repository = "https://github.com/Mossad-esc/stellar-footprint-engine"
Issues = "https://github.com/Mossad-esc/stellar-footprint-engine/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["stellar_footprint"]
