apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stellar-footprint-service.fullname" . }}-secret
  labels:
    {{- include "stellar-footprint-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  TESTNET_RPC_URL: {{ .Values.secrets.TESTNET_RPC_URL | quote }}
  MAINNET_RPC_URL: {{ .Values.secrets.MAINNET_RPC_URL | quote }}
  FUTURENET_RPC_URL: {{ .Values.secrets.FUTURENET_RPC_URL | quote }}
  TESTNET_SECRET_KEY: {{ .Values.secrets.TESTNET_SECRET_KEY | quote }}
  MAINNET_SECRET_KEY: {{ .Values.secrets.MAINNET_SECRET_KEY | quote }}
  FUTURENET_SECRET_KEY: {{ .Values.secrets.FUTURENET_SECRET_KEY | quote }}
  {{- if .Values.secrets.API_KEYS }}
  API_KEYS: {{ .Values.secrets.API_KEYS | quote }}
  {{- end }}
