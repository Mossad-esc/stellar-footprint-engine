worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;

  # Edge rate limiting zones
  limit_req_zone $binary_remote_addr zone=simulate_req:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=api_req:10m rate=30r/s;

  # Request buffering & payload limits
  client_max_body_size 256k;
  proxy_buffering on;
  proxy_buffer_size 16k;
  proxy_buffers 4 32k;
  proxy_busy_buffers_size 64k;

  # Upstream load balancing across service replicas (Docker Compose DNS)
  upstream stellar_backend {
    least_conn;
    server stellar-footprint-service:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
  }

  # HTTP: serve ACME challenge for Certbot and redirect all other traffic to HTTPS
  server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS edge reverse proxy
  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Let's Encrypt certificates (replace example.com with your domain)
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    error_page 429 = @too_many_requests;

    # Health probes (exempt from rate limiting)
    location ~ ^/(api/v1/)?health/(live|ready)$ {
      proxy_pass         http://stellar_backend;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Simulation endpoint with stricter edge rate limiting
    location = /api/v1/simulate {
      limit_req zone=simulate_req burst=10 nodelay;
      limit_req_status 429;
      proxy_pass         http://stellar_backend;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 35s;
      proxy_send_timeout 35s;
    }

    # Static asset caching (e.g., API docs assets)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
      expires 7d;
      add_header Cache-Control "public, immutable";
      proxy_pass         http://stellar_backend;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location @too_many_requests {
      internal;
      add_header Content-Type application/json always;
      return 429 '{"error":"Too many requests"}';
    }

    location / {
      limit_req zone=api_req burst=30 nodelay;
      limit_req_status 429;
      proxy_pass         http://stellar_backend;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 35s;
      proxy_send_timeout 35s;
    }
  }
}
