name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Coverage
        run: npm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Validate API Collections (Bruno)
        run: |
          cp -n .env.example .env || true
          PORT=3000 NODE_ENV=test node -r tsconfig-paths/register dist/index.js &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/v1/health/live > /dev/null; then
              break
            fi
            sleep 1
          done
          cd docs/bruno && npx --yes @usebruno/cli run --env local

      - name: Audit
        run: pnpm audit --audit-level=high || true
