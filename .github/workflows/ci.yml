name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      - name: Test & Coverage
        run: pnpm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == '22.x'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Post coverage summary to PR
        if: github.event_name == 'pull_request' && matrix.node-version == '22.x'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const summaryPath = "coverage/coverage-summary.json";
            if (!fs.existsSync(summaryPath)) return;
            const summary = JSON.parse(fs.readFileSync(summaryPath, "utf8")).total;
            const body = [
              "### Jest Coverage Summary",
              "",
              "| Metric | Coverage | Threshold |",
              "| --- | --- | --- |",
              `| Statements | ${summary.statements.pct}% | 90% |`,
              `| Branches | ${summary.branches.pct}% | 85% |`,
              `| Functions | ${summary.functions.pct}% | 90% |`,
              `| Lines | ${summary.lines.pct}% | 90% |`,
            ].join("\n");
            await core.summary.addRaw(body).write();
            const marker = "### Jest Coverage Summary";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Build
        run: pnpm run build

      - name: Audit
        run: pnpm audit --audit-level=high || true
